[package]
name = "clawrush"
version = "0.1.0"
description = "ClawRush: shared skill x VRF claw cabinet on MagicBlock Ephemeral Rollups"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "clawrush"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", features = ["token", "associated_token"] }
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf", "access-control"] }
